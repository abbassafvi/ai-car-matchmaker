services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - agent-backend

  agent-backend:
    build: ./agent-backend
    ports:
      - "8000:8000"
    depends_on:
      - mcp-services
      - phoenix

  mcp-services:
    build: ./mcp-services
    ports:
      - "8100:8100"

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      # host ports shifted to avoid colliding with a pre-existing
      # phoenix-mind-service container on the dev host using 6006/4317
      - "16006:6006"
      - "14317:4317"
