services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - agent-backend

  agent-backend:
    build: ./agent-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./agent-backend/.env
        required: false
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - MCP_MARKETPLACE_URL=http://mcp-services:8100/mcp
    volumes:
      - agent-backend-data:/app/data
    depends_on:
      # service_healthy, not the bare list form: the bare form only waits
      # for the container to *start*, so the agent could open its MCP
      # session against a server that has not bound its port yet.
      mcp-services:
        condition: service_healthy
      phoenix:
        condition: service_started

  mcp-services:
    build: ./mcp-services
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      # host ports shifted to avoid colliding with a pre-existing
      # phoenix-mind-service container on the dev host using 6006/4317
      - "16006:6006"
      - "14317:4317"

volumes:
  agent-backend-data:
