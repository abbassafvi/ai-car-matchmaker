[pytest]
# The two suites are run SEPARATELY, on purpose -- see `make test` / the
# command in handoff.md.
#
# agent-backend/ and mcp-services/ each have a top-level conftest.py, and
# several agent-backend tests do `from conftest import LLM_CREDENTIALS_PRESENT`.
# Pointed at both trees in one invocation, that bare import resolves against
# whichever root landed on sys.path first, so the documented one-liner died
# with "cannot import name 'LLM_CREDENTIALS_PRESENT' from 'conftest'" before
# running a single test. `--import-mode=importlib` does not help: the failing
# import is an ordinary sys.path lookup, not a test-module import.
#
# Fixing it properly means renaming the shared conftest symbols, which is a
# change to four test files for no behavioural gain. Two invocations is the
# honest answer, and this file exists so the settings are shared.
testpaths = tests
